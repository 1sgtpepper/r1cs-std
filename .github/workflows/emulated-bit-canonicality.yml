name: Emulated bit canonicality reproduction

on:
  push:
    branches:
      - repro/emulated-bit-canonicality
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      AFFECTED_REVISION: 45e4e2697626a9f9481fe57e70ed29c687194102
      REPRODUCTION_DIR: reproductions/emulated-bit-canonicality
    steps:
      - name: Check out reproduction
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2

      - name: Verify frozen base revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~1)" = "$AFFECTED_REVISION"
          test "$(git rev-list --count "$AFFECTED_REVISION"..HEAD)" -eq 1

      - name: Select Rust 1.85.1
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1

      - name: Run isolated reproduction
        shell: bash
        working-directory: ${{ env.REPRODUCTION_DIR }}
        run: |
          set -euo pipefail
          {
            git -C ../.. rev-parse HEAD HEAD~1
            rustc --version --verbose
            cargo --version --verbose
            sha256sum Cargo.toml Cargo.lock tests/emulated_bit_canonicality.rs
            cargo tree --locked
            cargo test --locked --test emulated_bit_canonicality witness_helper_must_not_expose_modulus_as_zero_bits -- --exact --nocapture
          } 2>&1 | tee reproduction.log

      - name: Preserve reproduction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: emulated-bit-canonicality-evidence-${{ github.run_id }}
          path: |
            reproductions/emulated-bit-canonicality/Cargo.toml
            reproductions/emulated-bit-canonicality/Cargo.lock
            reproductions/emulated-bit-canonicality/tests/emulated_bit_canonicality.rs
            reproductions/emulated-bit-canonicality/reproduction.log
          if-no-files-found: error
          retention-days: 30
